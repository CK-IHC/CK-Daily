<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde8c8"/>
      <stop offset="55%" stop-color="#f3b968"/>
      <stop offset="100%" stop-color="#c2792c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- steam -->
  <g stroke="#ffffff" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 206 140 C 188 122, 188 102, 206 84 C 224 66, 224 46, 206 28"/>
    <path d="M 306 140 C 288 122, 288 102, 306 84 C 324 66, 324 46, 306 28"/>
  </g>

  <!-- bread loaf (boule) -->
  <g>
    <ellipse cx="256" cy="380" rx="150" ry="24" fill="#000000" opacity="0.12"/>
    <path d="M 108 320
             C 100 230, 168 168, 256 168
             C 344 168, 412 230, 404 320
             C 398 372, 336 396, 256 396
             C 176 396, 114 372, 108 320 Z" fill="url(#crust)"/>
    <path d="M 108 320
             C 100 230, 168 168, 256 168
             C 344 168, 412 230, 404 320"
          fill="url(#shine)"/>
    <!-- bread score marks -->
    <g stroke="#8a4a12" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M 170 230 C 190 260, 190 300, 172 336"/>
      <path d="M 256 210 C 276 248, 276 300, 258 344"/>
      <path d="M 342 230 C 322 260, 322 300, 340 336"/>
    </g>
  </g>

  <text x="256" y="452" font-family="'Sarabun', Arial, sans-serif" font-size="70" font-weight="800" fill="#ffffff" text-anchor="middle">CK Daily</text>
</svg>
